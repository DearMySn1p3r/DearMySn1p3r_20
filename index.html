<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Studio</title>
<link rel="icon" type="image/png" href="MOMO.png">
<link rel="apple-touch-icon" href="MOMO.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f3f1;--pn:#fff;--ln:#ececea;--tx:#1a1a1d;--mu:#76767e;--mu2:#a6a6ad;--fill:#f5f5f4;--fill2:#eeeeec;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --disp:var(--sans);--serif:var(--sans);--kserif:var(--sans);--tech:var(--sans);--mono:var(--sans);
  --pr:14px;
}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:12.5px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ── top bar ── */
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--pn);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:-.025em}
.brand-mark{width:24px;height:24px;border-radius:7px;background:var(--tx);display:grid;place-items:center}
.btn{height:32px;padding:0 13px;border-radius:9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--tx);color:#fff}
.topr{display:flex;align-items:center;gap:6px}
.btn.ghost{color:var(--mu);background:transparent}
.btn.ghost:hover{background:var(--fill);color:var(--tx)}
.btn.ghost.arm{background:#fdecec;color:#d23b3b}
.btn.primary:hover{background:#000}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:240px;background:#fff;border:1px solid var(--ln);border-radius:13px;padding:5px;box-shadow:0 16px 40px -12px rgba(0,0,0,.2);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;pointer-events:none;transition:.16s}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.mseg{display:flex;gap:2px;padding:2px;margin:2px 2px 0;background:var(--fill);border-radius:9px}
.mseg button{flex:1;height:28px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--mu);transition:.15s}
.mseg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.03)}
.menu .mh{padding:8px 10px 6px;font-size:10.5px;color:var(--mu2);font-weight:500}
.menu button{width:100%;text-align:left;padding:8px 10px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:550}
.menu button:hover{background:var(--fill)}
.menu button span{font-size:11px;color:var(--mu2);font-weight:400}

/* ── layout ── */
.app{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 52px)}
.panel{background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.psec{padding:16px 16px 14px}
.sh{font-size:11px;font-weight:600;color:var(--mu2);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tb{height:36px;border-radius:10px;background:var(--fill);padding:0 11px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:550;color:#45454c;transition:background .15s,box-shadow .15s;text-align:left}
.tb:hover{background:var(--fill2);color:var(--tx)}
.tb i{width:12px;height:12px;border-radius:4px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tb.on{background:#fff;color:var(--tx);font-weight:650;box-shadow:0 0 0 1.5px var(--tx),0 2px 6px -2px rgba(0,0,0,.15)}
.tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--ln)}
.tabs button{height:38px;font-size:12.5px;font-weight:600;color:var(--mu2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--tx);border-bottom-color:var(--tx)}
.pbody{flex:1;overflow-y:auto;padding:16px 16px 40px}
.grp{margin-bottom:22px}
.link{font-size:11px;font-weight:500;color:var(--mu2);transition:color .15s}
.link:hover{color:var(--tx)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.fd{display:flex;flex-direction:column;gap:5px;grid-column:span 2;min-width:0}
.fd.h{grid-column:span 1}
.fd label{font-size:11px;font-weight:500;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.inp{width:100%;height:34px;border:1px solid transparent;border-radius:9px;padding:0 11px;background:var(--fill);font-size:12.5px;outline:none;transition:background .15s,border-color .15s,box-shadow .15s}
.inp:hover{background:var(--fill2)}
.inp::placeholder{color:#c2c2c6}
.inp:focus{background:#fff;border-color:#d4d4d8;box-shadow:0 0 0 3px rgba(26,26,29,.06)}
.inp.flash{background:#fff;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23a6a6ad' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 11px center;padding-right:28px}
.gen{font-size:10.5px;font-weight:500;color:var(--mu2);display:inline-flex;align-items:center;gap:3px}
.gen:hover{color:var(--tx)}
.hint{font-size:11px;color:var(--mu2);margin-top:12px;display:flex;align-items:center;gap:6px}

.drop{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--fill);cursor:pointer;transition:background .15s,box-shadow .15s}
.drop:hover{background:var(--fill2)}
.drop.over{background:#fff;box-shadow:0 0 0 1.5px var(--tx)}
.drop-th{width:40px;height:50px;border-radius:8px;background:#fff;overflow:hidden;flex-shrink:0;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.drop-th img{width:100%;height:100%;object-fit:cover}
.drop b{font-size:12.5px;font-weight:600;display:block}
.drop span{font-size:11px;color:var(--mu)}
.prow{display:flex;align-items:center;gap:10px;margin-top:12px;padding:0 2px}
.prow .k{font-size:11px;color:var(--mu);width:26px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:var(--fill2);outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.15);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.15);cursor:pointer}
.pacts{display:flex;gap:14px;margin-top:10px;padding:0 2px}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thm{border-radius:12px;padding:8px;background:var(--fill);display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:550;color:#45454c;transition:.15s;text-align:left}
.thm:hover{background:var(--fill2)}
.thm .pv{height:46px;border-radius:7px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.thm .pv::before{content:'';position:absolute;left:9px;top:10px;width:40%;height:5px;border-radius:3px;background:var(--a)}
.thm .pv::after{content:'';position:absolute;left:9px;top:21px;width:60%;height:4px;border-radius:3px;background:currentColor;opacity:.18;box-shadow:0 9px 0 currentColor}
.thm.on{background:#fff;color:var(--tx);font-weight:650;box-shadow:0 0 0 1.5px var(--tx)}
.sws{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.sw{width:100%;aspect-ratio:1;border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s}
.sw:hover{transform:scale(1.08)}
.sw.on::after{content:'';position:absolute;inset:-4px;border:1.5px solid var(--tx);border-radius:50%}
.sw.custom{background:conic-gradient(#f87171,#fbbf24,#34d399,#60a5fa,#a78bfa,#f472b6,#f87171)}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.gpre{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.gp{height:34px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);position:relative;transition:transform .12s}
.gp:hover{transform:translateY(-1px)}
.gp.on::after{content:'';position:absolute;inset:-3px;border:1.5px solid var(--tx);border-radius:11px}
.gcust{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--fill)}
.gpick{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0}
.gpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.gpick i{display:block;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 0 0 2px #fff}
.gpick span{font-size:10.5px;color:var(--mu)}
.gbar{flex:1;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);align-self:flex-start}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--fill)}
.srow .k{font-size:12.5px;font-weight:600}
.srow .d{font-size:11px;color:var(--mu);margin-top:2px}
.tg{width:34px;height:20px;border-radius:99px;background:#d4d4d8;position:relative;transition:.2s;flex-shrink:0}
.tg::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
.tg.on{background:var(--tx)}
.tg.on::after{transform:translateX(14px)}

/* ── stage ── */
.stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 1px 1px,rgba(0,0,0,.07) 1px,transparent 0) 0 0/22px 22px,var(--bg)}
.rig{display:flex;flex-direction:column;align-items:center;perspective:1800px;transform-origin:center;margin-bottom:36px}
.strap{position:relative;width:20px;height:96px;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,0) 22%,rgba(255,255,255,.08) 50%,rgba(0,0,0,0) 78%,rgba(0,0,0,.2)),repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,transparent 2px 4px),var(--sc,#333);margin-bottom:14px}
.strap::before{content:'';position:absolute;left:0;right:0;top:-400px;height:400px;background:inherit}
.clip{position:absolute;left:50%;bottom:-16px;width:30px;height:24px;margin-left:-15px;border-radius:6px 6px 10px 10px;background:linear-gradient(180deg,#f1f2f4,#b7bbc2);box-shadow:0 2px 4px rgba(0,0,0,.2),inset 0 1px 0 #fff;z-index:3}
.clip::after{content:'';position:absolute;left:50%;bottom:-9px;width:10px;height:13px;margin-left:-5px;border:2.5px solid #adb1b9;border-top:0;border-radius:0 0 6px 6px}
.flip{position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,.7,.2,1)}
.flip.b{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--pr);box-shadow:0 1px 1px rgba(0,0,0,.04),0 3px 8px rgba(0,0,0,.05),0 24px 48px -16px rgba(0,0,0,.28)}
.face.b{transform:rotateY(180deg)}
.face>.card{position:absolute;left:-11px;top:-11px}
#ff [data-ph]{cursor:grab;touch-action:none}
#ff [data-ph].noimg{cursor:pointer}
#ff [data-ph]::after{content:'';position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:center;font:600 9px/1.3 var(--sans);color:#fff;letter-spacing:0;text-align:center;opacity:0;transition:opacity .15s;pointer-events:none}
#ff [data-ph]:not(.noimg):hover::after{content:'클릭: 사진 바꾸기\A드래그: 위치 조정';white-space:pre;opacity:1;background:rgba(0,0,0,.28)}
body.dragging #ff [data-ph]::after{opacity:0!important}
body.dragging,body.dragging #ff [data-ph]{cursor:grabbing}
#stage [data-k]{cursor:text;border-radius:3px;outline:1.5px dashed transparent;outline-offset:1px;transition:outline-color .12s,background .12s}
#stage [data-k]:hover{outline-color:rgba(59,130,246,.7)}
#stage [data-k].editing{outline:1.5px solid #3b82f6;background:rgba(59,130,246,.1);text-overflow:clip}
#stage [data-k]:empty::before{content:attr(data-p);opacity:.32}
#stage [data-k].editing:empty::before{opacity:.22}
#stage .tog[data-k]{cursor:pointer}
#xp .emp{display:none!important}

.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:3px;background:#fff;border:1px solid var(--ln);border-radius:12px;box-shadow:0 6px 20px -6px rgba(0,0,0,.12)}
.seg{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:9px}
.seg button{height:28px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mu);padding:0 14px;transition:.15s}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.03)}
.dock-t{font-size:11px;color:var(--mu2);padding-right:12px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--tx);color:#fff;padding:9px 15px;border-radius:10px;font-size:12px;font-weight:500;opacity:0;transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
#xp{position:absolute;left:0;top:0;z-index:-10;pointer-events:none}

@media(max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  .stage{order:-1;min-height:500px}
  .panel{border-right:0;border-top:1px solid var(--ln)}
  .pbody{overflow:visible}
  .dock-t{display:none}
}

/* ── card base: 58×90mm work size (5.5px = 1mm) ── */
.card{position:relative;overflow:hidden;font-family:var(--sans);line-height:1.35;text-rendering:geometricPrecision;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;text-align:left}
.card *{box-sizing:border-box;margin:0}
.card.P{width:319px;height:495px}
.card.Ls{width:495px;height:319px}
.card .abs{position:absolute}
.card .deco{pointer-events:none}
.card .el{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .D{font-family:var(--disp);letter-spacing:0}
.card .Sf{font-family:var(--serif)}
.card .scr{font-family:'Yellowtail',cursive;font-weight:400;letter-spacing:0;white-space:nowrap}
.card .Ks{font-family:var(--kserif)}
.card .Tc{font-family:var(--tech);letter-spacing:0}
.card .mn{font-family:var(--mono);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.card .lb{font-family:var(--disp);font-size:6px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.card .mk{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:12px;flex-shrink:0}
.card .ph{position:relative;overflow:hidden;flex-shrink:0}
.card .ph img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:center}
.card svg{display:block;overflow:visible}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="brand-mark"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="10" r="2.5"/><path d="M8.5 16.5h7"/></svg></div>
    ID Studio
  </div>
  <div class="topr">
  <button class="btn ghost" id="resetBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>초기화</span></button>
  <div class="menu-wrap">
    <button class="btn primary" id="saveBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></svg>저장</button>
    <div class="menu" id="saveMenu">
      <div class="mseg" id="modeSeg"><button data-m="card">카드 이미지</button><button data-m="print">인쇄용</button></div>
      <div class="mh" id="modeHint"></div>
      <button data-save="cur">지금 보이는 면<span>1장</span></button>
      <button data-save="both">앞면 · 뒷면<span>2장</span></button>
      <button data-save="sheet">앞뒤 한 장으로<span>1장</span></button>
    </div>
  </div>
  </div>
</header>

<main class="app">
  <aside class="panel">
    <div class="psec">
      <div class="sh">템플릿</div>
      <div class="tgrid" id="tlist"></div>
    </div>
    <div class="tabs" id="ptabs">
      <button class="on" data-tab="info">내용</button>
      <button data-tab="style">스타일</button>
    </div>
    <div class="pbody">
      <section data-pane="info">
        <div class="grp">
          <div class="sh">사진</div>
          <label class="drop" id="drop">
            <div class="drop-th" id="dropTh"></div>
            <div><b id="dropT">사진 올리기</b><span>클릭하거나 끌어다 놓기</span></div>
            <input type="file" id="file" accept="image/*" hidden>
          </label>
          <div id="pctl" hidden>
            <div class="prow"><span class="k">확대</span><input type="range" id="zoom" min="1" max="6" step=".01" value="1"></div>
            <div class="pacts"><button class="link" id="pReset">위치 초기화</button><button class="link" id="pDel">삭제</button></div>
          </div>
        </div>
        <div class="grp">
          <div class="sh">정보<button class="link" id="clearF">모두 비우기</button></div>
          <div class="fields" id="fields"></div>
          <div class="hint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>카드 위 글씨를 눌러도 바로 수정돼요</div>
        </div>
      </section>
      <section data-pane="style" hidden>
        <div class="grp">
          <div class="sh">테마</div>
          <div class="themes" id="themeSeg">
            <button class="thm" data-th="0"><div class="pv" style="background:#fff;color:#000"></div>라이트</button>
            <button class="thm" data-th="1"><div class="pv" style="background:#17181c;color:#fff"></div>다크</button>
          </div>
        </div>
        <div class="grp">
          <div class="sh">포인트 컬러</div>
          <div class="sws" id="sws"></div>
        </div>
        <div class="grp" id="gradGrp" hidden>
          <div class="sh">배경 그라데이션<button class="link" id="gReset">자동</button></div>
          <div class="gpre" id="gpre"></div>
          <div class="gcust">
            <label class="gpick"><input type="color" id="g1"><i id="g1s"></i><span>위</span></label>
            <div class="gbar" id="gbar"></div>
            <label class="gpick"><input type="color" id="g2"><i id="g2s"></i><span>아래</span></label>
          </div>

function build(id,side){
  const t=T[id],st=S.style[id];
  const raw=k=>String(S.v[k]??'');
  const x={c:st.c,dk:st.dark,raw,g1:st.g1,g2:st.g2,
    v:k=>`<span data-k="${k}" data-p="${esc(LABEL[k]||k)}">${esc(raw(k))}</span>`,
    o:k=>raw(k).trim()?'':' emp'};
  return side==='b'?t.back(x):t.front(x);
}
const dims=t=>t.o==='l'?[495,319]:[319,495];
let scale=1,raf=0;
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;renderCard();});}
function renderCard(){
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#stage [data-k]'))return;
  const t=T[S.tpl],[W,H]=dims(t);
  const fl=$('#flip');fl.style.width=(W-2*BLEED)+'px';fl.style.height=(H-2*BLEED)+'px';fl.classList.toggle('b',S.side==='b');
  $('#ff').innerHTML=build(S.tpl,'f');$('#fb').innerHTML=build(S.tpl,'b');
  fillQR($('#ff'));fillQR($('#fb'));
  const st=$('#strap');st.hidden=!S.strap;st.style.setProperty('--sc',shade(S.style[S.tpl].c,.1));
  fit();persist();
}
function fit(){
  const t=T[S.tpl],[W0,H0]=dims(t),W=W0-2*BLEED,H=H0-2*BLEED,st=$('#stage'),sh=S.strap?110:0,mob=innerWidth<=860;
  const aw=st.clientWidth-48,ah=mob?1e9:st.clientHeight-140;
  scale=Math.max(.45,Math.min(1.25,aw/W,ah/(H+sh)));
  $('#rig').style.transform=`scale(${scale})`;
  st.style.height=mob?Math.round((H+sh)*scale+140)+'px':'';
}
function renderList(){$('#tlist').innerHTML=TPL.map(t=>`<button class="tb${t.id===S.tpl?' on':''}" data-id="${t.id}"><i style="background:${S.style[t.id].c}"></i>${t.name}</button>`).join('');}
function renderFields(){
  $('#fields').innerHTML=T[S.tpl].fields.map(f=>{
    const ctl=f.sel?`<select class="inp" data-k="${f.k}"><option value="">선택</option>${f.sel.map(o=>`<option${S.v[f.k]===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`
      :`<input class="inp" data-k="${f.k}" value="${esc(S.v[f.k]??'')}" placeholder="${esc(f.ph||'')}">`;
    return`<div class="fd${f.h?' h':''}"><label>${f.l}${f.gen?`<button class="gen" data-gen="${f.gen}" data-k="${f.k}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 11-2.3-5.7M20 4v5h-5"/></svg>생성</button>`:''}</label>${ctl}</div>`;
  }).join('');
}
function renderPhotoCtl(){
  const p=S.photo;$('#pctl').hidden=!p.src;
  $('#dropTh').innerHTML=p.src?`<img src="${p.src}" alt="">`:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a6a6ad" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>`;
  $('#dropT').textContent=p.src?'사진 바꾸기':'사진 올리기';$('#zoom').value=p.z;
}
function renderStyle(){
  const st=S.style[S.tpl];
  $$('#themeSeg .thm').forEach(b=>{b.classList.toggle('on',(b.dataset.th==='1')===st.dark);b.querySelector('.pv').style.setProperty('--a',st.c);});
  const inPal=PALETTE.includes(st.c.toLowerCase());
  $('#sws').innerHTML=PALETTE.map(c=>`<button class="sw${st.c.toLowerCase()===c?' on':''}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')+`<label class="sw custom${inPal?'':' on'}" title="직접 고르기"><input type="color" id="cpick" value="${st.c}"></label>`;
  $('#strapTg').classList.toggle('on',S.strap);
  const gg=!!T[S.tpl].grad;$('#gradGrp').hidden=!gg;
  if(gg){const ga=gradAuto(st.c),a=st.g1||ga[0],b=st.g2||ga[1];
    $('#gpre').innerHTML=GRADS.map(([x,y],i)=>`<button class="gp${st.g1===x&&st.g2===y?' on':''}" data-i="${i}" style="background:linear-gradient(180deg,${x},${y})" aria-label="그라데이션 ${i+1}"></button>`).join('');
    $('#g1').value=a;$('#g2').value=b;$('#g1s').style.background=a;$('#g2s').style.background=b;$('#gbar').style.background=`linear-gradient(90deg,${a},${b})`;
    $('#gReset').style.visibility=st.g1||st.g2?'visible':'hidden';}
}
function setTab(tab){S.tab=tab;$$('#ptabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$$('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==tab);persist();}
function setSide(s){S.side=s;$$('#sideSeg button').forEach(b=>b.classList.toggle('on',b.dataset.side===s));$('#flip').classList.toggle('b',s==='b');persist();}

/* ───────── events ───────── */
$('#ptabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab);});
$('#sideSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setSide(b.dataset.side);});
$('#tlist').addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b)return;S.tpl=b.dataset.id;setSide('f');renderList();renderFields();renderStyle();renderCard();});
$('#fields').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;S.v[k]=e.target.value;schedule();});
$('#fields').addEventListener('click',e=>{
  const b=e.target.closest('[data-gen]');if(!b)return;e.preventDefault();
  const g=b.dataset.gen,n=()=>Math.floor(Math.random()*9000+1000);
  const val=g==='Y'?`${YEAR}-${Math.floor(Math.random()*90000+10000)}`:`${g}-${n()}`;
  S.v[b.dataset.k]=val;const inp=$(`#fields input[data-k="${b.dataset.k}"]`);if(inp)inp.value=val;schedule();
});
$('#clearF').onclick=()=>{T[S.tpl].fields.forEach(f=>S.v[f.k]='');renderFields();schedule();};
$('#themeSeg').addEventListener('click',e=>{const b=e.target.closest('.thm');if(!b)return;S.style[S.tpl].dark=b.dataset.th==='1';renderStyle();renderCard();});
$('#sws').addEventListener('click',e=>{const b=e.target.closest('.sw[data-c]');if(!b)return;S.style[S.tpl].c=b.dataset.c;renderStyle();renderList();renderCard();});
$('#sws').addEventListener('input',e=>{if(e.target.id!=='cpick')return;S.style[S.tpl].c=e.target.value;$$('#sws .sw').forEach(s=>s.classList.toggle('on',s.classList.contains('custom')));renderList();schedule();});
$('#gpre').addEventListener('click',e=>{const b=e.target.closest('.gp');if(!b)return;const[x,y]=GRADS[+b.dataset.i];Object.assign(S.style[S.tpl],{g1:x,g2:y});renderStyle();renderCard();});
['g1','g2'].forEach(k=>$('#'+k).addEventListener('input',e=>{const st=S.style[S.tpl];if(!st.g1||!st.g2){const ga=gradAuto(st.c);st.g1=st.g1||ga[0];st.g2=st.g2||ga[1];}st[k]=e.target.value;$('#'+k+'s').style.background=e.target.value;$('#gbar').style.background=`linear-gradient(90deg,${st.g1},${st.g2})`;$('#gReset').style.visibility='visible';$$('#gpre .gp').forEach(x=>x.classList.remove('on'));schedule();}));
$('#gReset').onclick=()=>{const st=S.style[S.tpl];delete st.g1;delete st.g2;renderStyle();renderCard();};
$('#strapTg').onclick=()=>{S.strap=!S.strap;renderStyle();renderCard();};

/* ── inline editing on the card ── */
function caretEnd(el){const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}
$('#stage').addEventListener('click',e=>{
  const el=e.target.closest('#stage [data-k]');if(!el||el.isContentEditable)return;
  const k=el.dataset.k;
  if(SELK.has(k)){
    setTab('info');const s=$(`#fields select[data-k="${k}"]`);
    if(s){s.scrollIntoView({block:'center',behavior:'smooth'});s.focus();s.classList.add('flash');setTimeout(()=>s.classList.remove('flash'),900);try{s.showPicker()}catch(_){}}
    return;
  }
  el.contentEditable='plaintext-only';if(el.contentEditable!=='plaintext-only')el.contentEditable='true';
  el.classList.add('editing');el.focus();caretEnd(el);
});
$('#stage').addEventListener('input',e=>{
  const el=e.target.closest&&e.target.closest('[data-k]');if(!el||!el.isContentEditable)return;
  const k=el.dataset.k,val=el.textContent.replace(/\n/g,'');S.v[k]=val;
  const inp=$(`#fields input[data-k="${k}"]`);if(inp)inp.value=val;
  $$(`#stage [data-k="${k}"]`).forEach(x=>{if(x!==el&&!x.classList.contains('tog'))x.textContent=val;});
  persist();
});
$('#stage').addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-k]');if(el&&el.isContentEditable&&(e.key==='Enter'||e.key==='Escape')){e.preventDefault();el.blur();}});
$('#stage').addEventListener('focusout',e=>{const el=e.target.closest&&e.target.closest('[data-k]');if(!el||!el.isContentEditable)return;el.removeAttribute('contenteditable');el.classList.remove('editing');setTimeout(renderCard,0);});
$('#stage').addEventListener('paste',e=>{const el=e.target.closest&&e.target.closest('[data-k]');if(!el||!el.isContentEditable)return;e.preventDefault();document.execCommand('insertText',false,(e.clipboardData.getData('text/plain')||'').replace(/\s*\n\s*/g,' '));});

/* photo upload */
function loadFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  const rd=new FileReader();
  rd.onload=ev=>{const img=new Image();img.onload=()=>{
    const m=1600,k=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    S.photo={src:cv.toDataURL('image/jpeg',.93),ratio:cv.width/cv.height,x:0,y:0,z:1};
    renderPhotoCtl();renderCard();toast('사진을 적용했어요');
  };img.src=ev.target.result;};
  rd.readAsDataURL(f);
}
$('#file').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value='';});
const drop=$('#drop');
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
function frontFrame(){const f=$('#ff [data-ph]');return f?[+f.dataset.w,+f.dataset.h]:null;}
function clampState(){const f=frontFrame();if(!f||!S.photo.src)return;[S.photo.x,S.photo.y]=clampXY(f[0],f[1],S.photo.x,S.photo.y,S.photo.z,S.photo.ratio);}
function applyPhoto(){const p=S.photo;$$('#stage [data-ph]').forEach(f=>{const i=f.querySelector('img');if(!i)return;const[cx,cy]=clampXY(+f.dataset.w,+f.dataset.h,p.x,p.y,p.z,p.ratio);i.style.transform=`translate(${cx}px,${cy}px) scale(${p.z})`;});}
function setZoom(z){S.photo.z=Math.min(ZMAX,Math.max(ZMIN,z));clampState();$('#zoom').value=S.photo.z;applyPhoto();persist();}
$('#zoom').addEventListener('input',e=>setZoom(+e.target.value));
$('#pReset').onclick=()=>{S.photo.x=0;S.photo.y=0;S.photo.z=1;renderPhotoCtl();renderCard();};
$('#pDel').onclick=()=>{S.photo={src:null,ratio:.75,x:0,y:0,z:1};renderPhotoCtl();renderCard();};

/* drag to move · pinch / wheel to zoom · tap to choose a photo */
let drag=null;const ptrs=new Map();
$('#stage').addEventListener('pointerdown',e=>{
  const ph=e.target.closest('#ff [data-ph]');if(!ph||S.side!=='f'||e.button>0)return;
  e.preventDefault();if(!ptrs.size&&S.photo.src)clampState();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,ox:S.photo.x,oy:S.photo.y,moved:false,has:!!S.photo.src,pinch:null};if(drag.has)document.body.classList.add('dragging');}
  else if(ptrs.size===2&&drag&&drag.has){const[a,b]=[...ptrs.values()];drag.pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:S.photo.z};drag.moved=true;}
});
addEventListener('pointermove',e=>{
  if(!drag||!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(drag.pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];setZoom(drag.pinch.z0*Math.hypot(a.x-b.x,a.y-b.y)/drag.pinch.d0);return;}
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;if(!drag.has||!drag.moved)return;
  S.photo.x=drag.ox+dx/scale;S.photo.y=drag.oy+dy/scale;clampState();applyPhoto();
});
function endPtr(e,cancel){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size)return;const d=drag;drag=null;document.body.classList.remove('dragging');if(!d)return;if(!cancel&&!d.moved){$('#file').click();return;}if(d.has){clampState();persist();}}
addEventListener('pointerup',e=>endPtr(e,false));
addEventListener('pointercancel',e=>endPtr(e,true));
$('#stage').addEventListener('wheel',e=>{
  if(!e.target.closest('#ff [data-ph]')||!S.photo.src||S.side!=='f')return;
  e.preventDefault();setZoom(S.photo.z*Math.exp(-e.deltaY*.0018));
},{passive:false});
addEventListener('resize',fit);

/* ───────── export (58×90mm work size, 600dpi) ───────── */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
if(S.exportMode!=='print')S.exportMode='card';
function renderMode(){$$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.exportMode));$('#modeHint').textContent=S.exportMode==='card'?'둥근 모서리 · 투명 배경 · 54×86mm · 600dpi':'재단 여백 2mm 포함 · 58×90mm · 600dpi';}
const FONT_SRC=[['Pretendard Variable','https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2','45 920'],
  ['Yellowtail','https://cdn.jsdelivr.net/npm/@fontsource/yellowtail@5.3.0/files/yellowtail-latin-400-normal.woff2','400']];
let FONT_CSS=null;
async function fontCSS(){
  if(FONT_CSS!==null)return FONT_CSS;
  const parts=await Promise.all(FONT_SRC.map(async([f,u,w])=>{try{const r=await fetch(u);if(!r.ok)throw 0;const bl=await r.blob();
    const d=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(bl);});
    return`@font-face{font-family:'${f}';src:url(${d}) format('woff2');font-weight:${w};font-style:normal;font-display:block}`;}catch(e){return'';}}));
  return FONT_CSS=parts.join('');
}
async function shot(side){
  const xp=$('#xp');xp.innerHTML=build(S.tpl,side);fillQR(xp);
  try{await document.fonts.ready}catch(e){}
  await sleep(150);
  await Promise.all([...xp.querySelectorAll('img')].map(i=>i.complete&&i.naturalWidth?0:new Promise(r=>{i.onload=i.onerror=r;})));
  const node=xp.firstElementChild,ratio=DPI/25.4/PX;let cv=null;
  if(window.htmlToImage){
    try{const css=await fontCSS(),opt={pixelRatio:ratio,cacheBust:false,width:node.offsetWidth,height:node.offsetHeight,style:{margin:'0'}};if(css)opt.fontEmbedCSS=css;
      await htmlToImage.toCanvas(node,opt);   /* warm-up pass: lets the browser decode embedded fonts & images */
      cv=await htmlToImage.toCanvas(node,opt);}catch(e){console.warn('html-to-image failed, falling back',e);cv=null;}
  }
  if(!cv)cv=await html2canvas(node,{scale:ratio,backgroundColor:null,useCORS:true,logging:false,scrollX:-window.scrollX,scrollY:-window.scrollY});
  xp.innerHTML='';
  return finish(cv);
}
/* card mode: trim the 2mm bleed and round the corners like a real ID card; print mode: full 58×90mm work size */
function finish(src){
  if(S.exportMode==='print'){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0);return c;}
  const k=src.width/(T[S.tpl].o==='l'?495:319),b=Math.round(BLEED*k),w=src.width-2*b,h=src.height-2*b,r=14*k;
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.beginPath();x.moveTo(r,0);x.arcTo(w,0,w,h,r);x.arcTo(w,h,0,h,r);x.arcTo(0,h,0,0,r);x.arcTo(0,0,w,0,r);x.closePath();x.clip();
  x.drawImage(src,-b,-b);return c;
}
function crc32(b){let crc=-1;for(let n=0;n<b.length;n++){let c=(crc^b[n])&255;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc=(crc>>>8)^c;}return(crc^-1)>>>0;}
async function withDpi(blob){
  const b=new Uint8Array(await blob.arrayBuffer()),ppm=Math.round(DPI/0.0254);
  const ch=new Uint8Array(21),dv=new DataView(ch.buffer);
  dv.setUint32(0,9);ch.set([112,72,89,115],4);dv.setUint32(8,ppm);dv.setUint32(12,ppm);ch[16]=1;dv.setUint32(17,crc32(ch.subarray(4,17)));
  const out=new Uint8Array(b.length+21);out.set(b.subarray(0,33));out.set(ch,33);out.set(b.subarray(33),54);
  return new Blob([out],{type:'image/png'});
}
function dl(cv,name){cv.toBlob(async b=>{try{b=await withDpi(b)}catch(_){}const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);},'image/png');}
async function doSave(kind){
  $('#saveMenu').classList.remove('open');toast('이미지를 만드는 중…',true);
  const n=S.tpl,ts=Date.now();
  try{
    const sz=S.exportMode==='print'?'print-58x90mm':'card';
    if(kind==='cur'){dl(await shot(S.side),`${n}-${S.side==='b'?'back':'front'}-${sz}.png`);}
    else if(kind==='both'){const f=await shot('f'),b=await shot('b');dl(f,`${n}-front-${sz}.png`);await sleep(500);dl(b,`${n}-back-${sz}.png`);}
    else{const f=await shot('f'),b=await shot('b'),g=Math.round(DPI/25.4*6);const cv=document.createElement('canvas');cv.width=f.width+b.width+g;cv.height=Math.max(f.height,b.height);const x=cv.getContext('2d');if(S.exportMode==='print'){x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);}x.drawImage(f,0,0);x.drawImage(b,f.width+g,0);dl(cv,`${n}-sheet-${ts}.png`);}
    toast('저장했어요');
  }catch(e){console.error(e);toast('저장에 실패했어요');}
}
$('#saveBtn').onclick=e=>{e.stopPropagation();$('#saveMenu').classList.toggle('open');};
$('#saveMenu').addEventListener('click',e=>{const m=e.target.closest('#modeSeg button');if(m){e.stopPropagation();S.exportMode=m.dataset.m;renderMode();persist();return;}const b=e.target.closest('[data-save]');if(b)doSave(b.dataset.save);});
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))$('#saveMenu').classList.remove('open');});
let rT;
$('#resetBtn').onclick=()=>{const b=$('#resetBtn');
  if(!b.classList.contains('arm')){b.classList.add('arm');b.querySelector('span').textContent='한 번 더 누르면 초기화';clearTimeout(rT);rT=setTimeout(()=>{b.classList.remove('arm');b.querySelector('span').textContent='초기화';},3000);return;}
  clearTimeout(rT);b.classList.remove('arm');b.querySelector('span').textContent='초기화';
  const tpl=S.tpl,tab=S.tab;S={tpl,v:{},style:{},photo:{src:null,ratio:.75,x:0,y:0,z:1},strap:true,side:'f',tab,exportMode:'card'};
  TPL.forEach(t=>{S.style[t.id]={...t.def};});
  try{localStorage.removeItem(KEY)}catch(e){}
  renderList();renderFields();renderPhotoCtl();renderStyle();renderMode();setSide('f');renderCard();toast('전체 초기화했어요');
};
let toT;function toast(m,stay){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toT);if(!stay)toT=setTimeout(()=>t.classList.remove('show'),2000);}

/* ───────── init ───────── */
renderList();renderFields();renderPhotoCtl();renderStyle();setSide(S.side);setTab(S.tab);renderMode();renderCard();
if(document.fonts)document.fonts.ready.then(()=>renderCard());
</script>
